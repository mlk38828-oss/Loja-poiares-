<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja Poiares</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#f5f6fa;color:#171923}
header{height:68px;background:#fff;display:flex;align-items:center;padding:0 6%;gap:20px;position:sticky;top:0;z-index:3;box-shadow:0 2px 12px #0001}
.logo{font-size:22px;font-weight:800;margin-right:auto}.logo span{color:#7040ee}
nav{display:flex;gap:18px}nav a{text-decoration:none;color:#222;font-weight:bold}
.cart{border:0;background:#171923;color:white;border-radius:10px;padding:10px 14px}
.hero{margin:25px 6%;padding:60px 8%;border-radius:25px;background:linear-gradient(135deg,#171923,#7040ee);color:#fff}
.hero h1{font-size:46px;margin:10px 0}.hero strong{color:#ddd0ff}.hero a{display:inline-block;margin-top:12px;background:#fff;color:#171923;padding:13px 18px;border-radius:10px;text-decoration:none;font-weight:bold}
section.prod{padding:35px 6%}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top input{padding:12px;border:1px solid #ddd;border-radius:10px;width:250px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.card{background:#fff;padding:14px;border-radius:16px;box-shadow:0 5px 20px #0001}.pic{height:170px;border-radius:12px;background:#e9e9ef;display:grid;place-items:center;font-size:55px}.card button,.partner button,.final{width:100%;padding:11px;background:#7040ee;color:#fff;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
.partner{margin:20px 6% 60px;padding:35px;border-radius:20px;background:#171923;color:white}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:center;justify-content:center}.box{background:#fff;width:min(480px,92%);padding:25px;border-radius:18px}.close{float:right;border:0;background:none;font-size:28px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
footer{text-align:center;padding:25px;color:#777}@media(max-width:650px){nav{display:none}.hero h1{font-size:36px}.top{display:block}.top input{width:100%;margin-bottom:18px}}
</style>
</head>
<body>
<header><div class="logo">Loja <span>Poiares</span></div>
<nav><a href="#inicio">Início</a><a href="#produtos">Produtos</a><a href="#parceiros">Parceiros</a></nav>
<button class="cart" onclick="abrir()">🛒 <b id="qtd">0</b></button></header>

<section class="hero" id="inicio"><p>OFERTAS ONLINE</p><h1>Bem-vindo à <strong>Loja Poiares</strong></h1><p>Produtos de parceiros em um só lugar.</p><a href="#produtos">Ver produtos</a></section>

<section class="prod" id="produtos"><div class="top"><h2>Produtos em destaque</h2><input id="busca" placeholder="🔎 Procurar produto" oninput="mostrar()"></div><div id="lista" class="grid"></div></section>

<section class="partner" id="parceiros"><h2>Venda com a Loja Poiares</h2><p>Seja parceiro e apresente seus produtos.</p><button onclick="alert('Área de parceiros: demonstração')">Quero ser parceiro</button></section>

<div class="modal" id="modal"><div class="box"><button class="close" onclick="fechar()">×</button><h2>Seu carrinho</h2><div id="itens"></div><h3>Total: <span id="total">R$ 0,00</span></h3><button class="final" onclick="finalizar()">Finalizar pedido</button></div></div>
<footer>© 2026 Loja Poiares</footer>

<script>
const produtos=[
["Fone Bluetooth",89.90,"🎧"],["Smartwatch",129.90,"⌚"],["Mochila",79.90,"🎒"],
["Camiseta",49.90,"👕"],["Tênis esportivo",159.90,"👟"],["Caixa de som",99.90,"🔊"]];
let carrinho=[];
const dinheiro=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function mostrar(){let t=document.getElementById("busca").value.toLowerCase();document.getElementById("lista").innerHTML=produtos.filter(p=>p[0].toLowerCase().includes(t)).map((p,i)=>`<article class="card"><div class="pic">${p[2]}</div><h3>${p[0]}</h3><p><b>${dinheiro(p[1])}</b></p><button onclick="add(${i})">Adicionar ao carrinho</button></article>`).join("")}
function add(i){carrinho.push(produtos[i]);atualizar();alert("Produto adicionado!")}
function atualizar(){document.getElementById("qtd").textContent=carrinho.length;document.getElementById("itens").innerHTML=carrinho.length?carrinho.map((p,i)=>`<div class="row"><span>${p[2]} ${p[0]}</span><b>${dinheiro(p[1])} <button onclick="remover(${i})">×</button></b></div>`).join(""):"<p>Carrinho vazio.</p>";document.getElementById("total").textContent=dinheiro(carrinho.reduce((s,p)=>s+p[1],0))}
function remover(i){carrinho.splice(i,1);atualizar()}function abrir(){document.getElementById("modal").style.display="flex";atualizar()}function fechar(){document.getElementById("modal").style.display="none"}function finalizar(){alert(carrinho.length?"Demonstração: pedido criado. Pagamento real ainda não conectado.":"Adicione um produto primeiro.")}
mostrar();atualizar();
</script>
</body>
</html>
